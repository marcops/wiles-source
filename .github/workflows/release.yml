name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout wiles-source
        uses: actions/checkout@v4
        with:
          path: wiles-source

      - name: Checkout wiles-public
        uses: actions/checkout@v4
        with:
          repository: marcops/wiles
          token: ${{ secrets.WILES_PUBLIC_DEPLOY_KEY }}
          path: wiles-public

      - name: Guard rails (tag matches appVersion, release notes exist)
        run: |
          VERSION=$(grep -o 'appVersion = "[^"]*"' wiles-source/Sources/Wiles/Constants/AppConstants.swift | cut -d'"' -f2)
          if [[ -z "$VERSION" ]]; then
            echo "error: could not read appVersion from AppConstants.swift" >&2
            exit 1
          fi
          echo "==> Releasing Wiles v$VERSION"

          # A tag-triggered run must publish exactly what the tag says, never silently build
          # whatever appVersion happens to be — catches "pushed v0.5.0 but forgot to bump the
          # source" before anything gets built.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            if [[ "${{ github.ref_name }}" != "v${VERSION}" ]]; then
              echo "error: tag ${{ github.ref_name }} does not match appVersion $VERSION in AppConstants.swift" >&2
              exit 1
            fi
          fi

          # Never ship a version with no changelog entry for it.
          if ! grep -q "^## Version ${VERSION}$" wiles-public/RELEASE_NOTES.md; then
            echo "error: wiles-public/RELEASE_NOTES.md has no '## Version ${VERSION}' entry" >&2
            exit 1
          fi

      - name: Lint (SwiftLint)
        working-directory: wiles-source
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint lint --strict

      - name: Format check (SwiftFormat)
        working-directory: wiles-source
        run: |
          if ! command -v swiftformat >/dev/null 2>&1; then
            brew install swiftformat
          fi
          swiftformat --lint .

      - name: Unit tests (WilesTests, RAM-backed scratch disk)
        working-directory: wiles-source
        run: |
          scripts/setup_test_ramdisk.sh
          swift test --filter WilesTests

      - name: Build & package (.zip + .dmg)
        working-directory: wiles-source
        run: |
          VERSION=$(grep -o 'appVersion = "[^"]*"' Sources/Wiles/Constants/AppConstants.swift | cut -d'"' -f2)
          if [[ -z "$VERSION" ]]; then
            echo "error: could not read appVersion from AppConstants.swift" >&2
            exit 1
          fi
          echo "==> Building Wiles v$VERSION"

          DIST_DIR="dist"
          APP_DIR="$DIST_DIR/Wiles.app"
          rm -rf "$APP_DIR"
          mkdir -p "$DIST_DIR" "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"

          echo "==> 1. Building release binary (swift build -c release --arch arm64)..."
          swift build -c release --arch arm64 2>&1 | tee /tmp/wiles_build.log
          if grep -qi "warning:" /tmp/wiles_build.log; then
            echo "error: build produced warnings — releases require a zero-warning build" >&2
            grep -i "warning:" /tmp/wiles_build.log
            exit 1
          fi

          BIN_PATH=""
          if [[ -f ".build/arm64-apple-macosx/release/Wiles" ]]; then
            BIN_PATH=".build/arm64-apple-macosx/release/Wiles"
          elif [[ -f ".build/release/Wiles" ]]; then
            BIN_PATH=".build/release/Wiles"
          else
            echo "error: release binary not found" >&2
            exit 1
          fi
          cp "$BIN_PATH" "$APP_DIR/Contents/MacOS/Wiles"

          if [[ -d ".build/arm64-apple-macosx/release/Wiles_Wiles.bundle" ]]; then
            cp -r ".build/arm64-apple-macosx/release/Wiles_Wiles.bundle" "$APP_DIR/Contents/Resources/"
          elif [[ -d ".build/release/Wiles_Wiles.bundle" ]]; then
            cp -r ".build/release/Wiles_Wiles.bundle" "$APP_DIR/Contents/Resources/"
          fi
          if [[ ! -d "$APP_DIR/Contents/Resources/Wiles_Wiles.bundle" ]]; then
            echo "error: Wiles_Wiles.bundle missing from Contents/Resources" >&2
            exit 1
          fi

          if [[ -f "Sources/Wiles/Resources/AppIcon.icns" ]]; then
            cp "Sources/Wiles/Resources/AppIcon.icns" "$APP_DIR/Contents/Resources/AppIcon.icns"
          fi

          sed "s/__VERSION__/$VERSION/g" Info.plist > "$APP_DIR/Contents/Info.plist"

          echo "==> 2. Ad-hoc codesign..."
          codesign --force --deep --sign - "$APP_DIR"

          ZIP_PATH="$DIST_DIR/wiles-v$VERSION.zip"
          DMG_PATH="$DIST_DIR/wiles-v$VERSION.dmg"
          rm -f "$ZIP_PATH" "$DMG_PATH"

          echo "==> 3. Creating ZIP archive (for Homebrew Cask)..."
          (cd "$DIST_DIR" && /usr/bin/zip -r -y "wiles-v$VERSION.zip" "Wiles.app")

          echo "==> 4. Creating DMG package..."
          STAGING_DIR=$(mktemp -d)
          cp -R "$APP_DIR" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "Wiles" -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_PATH"
          rm -rf "$STAGING_DIR"

          SHA256=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
          echo "==> Build Release Successful! version=$VERSION sha256=$SHA256"

      - name: Read version & sha256
        id: version
        working-directory: wiles-source
        run: |
          VERSION=$(grep -o 'appVersion = "[^"]*"' Sources/Wiles/Constants/AppConstants.swift | cut -d'"' -f2)
          SHA256=$(shasum -a 256 "dist/wiles-v${VERSION}.zip" | awk '{print $1}')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.WILES_PUBLIC_DEPLOY_KEY }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          # Re-running for an already-published version (retry, or a workflow fix) must not be a
          # hard failure on the duplicate tag — this repo's gh CLI predates --clobber, so delete
          # and recreate instead.
          if gh release view "$TAG" --repo marcops/wiles >/dev/null 2>&1; then
            gh release delete "$TAG" --repo marcops/wiles --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            "wiles-source/dist/wiles-v${{ steps.version.outputs.value }}.zip" \
            "wiles-source/dist/wiles-v${{ steps.version.outputs.value }}.dmg" \
            --repo marcops/wiles \
            --title "Wiles v${{ steps.version.outputs.value }}" \
            --notes "See RELEASE_NOTES.md in marcops/wiles" \
            --latest

      - name: Update Cask in wiles-public
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SHA256: ${{ steps.version.outputs.sha256 }}
        run: |
          cd wiles-public
          git config user.name "wiles-release-bot"
          git config user.email "release-bot@users.noreply.github.com"

          # Points straight at the GitHub Release asset (already published + sha256-verified in
          # the previous step) instead of a commit in this repo — that URL is immutable per tag,
          # so there's no CDN-caching footgun to pin around and nothing to commit here.
          cat > Casks/wiles.rb <<CASK
          cask "wiles" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/marcops/wiles/releases/download/v#{version}/wiles-v#{version}.zip"
            name "Wiles"
            desc "Ultra-fast modern macOS File Manager"
            homepage "https://github.com/marcops/wiles"

            depends_on macos: :sonoma

            app "Wiles.app"

            postflight do
              system_command "xattr",
                             args: ["-cr", "#{appdir}/Wiles.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Preferences/com.marco.wiles.plist",
              "~/Library/Saved Application State/com.marco.wiles.savedState",
              "~/Library/Caches/Wiles",
            ]
          end
          CASK

          git add Casks/wiles.rb
          if ! git diff --cached --quiet; then
            git commit -m "cask(wiles): update to v${VERSION}"
            git push origin main
          fi
