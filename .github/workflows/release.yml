name: CI / Release

on:
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    if: github.ref_type != 'tag' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4

      - name: swift build (zero warnings required)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log
          if grep -qi "warning:" build.log; then
            echo "::error::Build produced warnings. Zero warnings are required."
            grep -i "warning:" build.log
            exit 1
          fi

      - name: swift test
        run: swift test

  release:
    name: Package & Publish
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout wiles-source (tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: swift build (zero warnings required)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log
          if grep -qi "warning:" build.log; then
            echo "::error::Build produced warnings. Zero warnings are required."
            grep -i "warning:" build.log
            exit 1
          fi

      - name: swift test
        run: swift test

      - name: Verify tag matches AppConstants.appVersion
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SRC_VERSION=$(grep -o 'appVersion = "[^"]*"' Sources/Wiles/Constants/AppConstants.swift | cut -d'"' -f2)
          if [[ "$TAG_VERSION" != "$SRC_VERSION" ]]; then
            echo "::error::Tag v$TAG_VERSION does not match AppConstants.appVersion ($SRC_VERSION). Bump the version before tagging."
            exit 1
          fi

      - name: Build & package
        run: |
          chmod +x scripts/build_release.sh
          scripts/build_release.sh | tee build_release.out
          echo "VERSION=$(grep '^version=' build_release.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "SHA256=$(grep '^sha256=' build_release.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Set up SSH deploy key for wiles-public
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WILES_PUBLIC_DEPLOY_KEY }}

      - name: Clone wiles-public
        run: |
          git clone git@github.com:marcops/wiles.git public-repo

      - name: Copy release artifacts & update Cask
        run: |
          cp "dist/wiles-v${VERSION}.zip" "public-repo/releases/"
          cp "dist/wiles-v${VERSION}.dmg" "public-repo/releases/"

          # Placeholder URL commit sha, corrected below after the commit is made.
          cat > public-repo/Casks/wiles.rb <<CASK
          cask "wiles" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://raw.githubusercontent.com/marcops/wiles/main/releases/wiles-v#{version}.zip"
            name "Wiles"
            desc "Ultra-fast modern macOS File Manager"
            homepage "https://github.com/marcops/wiles"

            depends_on macos: :sonoma

            app "Wiles.app"

            postflight do
              system_command "xattr",
                             args: ["-cr", "#{appdir}/Wiles.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Preferences/com.wiles.app.plist",
              "~/Library/Saved Application State/com.wiles.app.savedState",
            ]
          end
          CASK

      - name: Commit & push wiles-public
        run: |
          cd public-repo
          git config user.name "wiles-ci"
          git config user.email "ci@wiles.app"
          git add releases/ Casks/wiles.rb
          git commit -m "release: v${VERSION}" || echo "nothing to commit"
          git push origin main
