excluded:
  - .build
  - .swiftpm
  - dist
  - releases
  - Wiles.app
  - .claude

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - closure_spacing
  - empty_count
  - fatal_error_message
  - first_where
  - overridden_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - weak_delegate
  - prefer_self_in_static_references
  - yoda_condition
  - modifier_order
  - attributes
  - explicit_init
  - array_init
  - last_where
  - contains_over_first_not_nil
  - redundant_type_annotation
  - closure_body_length

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 180
  error: 180

# type_body_length is nudged just above AppState.swift's current 433 lines — known, accepted
# pre-release debt, not a license to grow further. PreferencesStore's one oversized/complex
# function is exempted individually via inline `swiftlint:disable` comments instead of loosening
# this rule globally, so every other function in the codebase stays held to the tight default.
type_body_length:
  warning: 440
  error: 600

# AGENTS.md rule 7: closures MUST NOT exceed 25 lines. validate.sh runs `swiftlint lint --strict`,
# which fails the build on ANY warning, not just errors — so `warning: 25` is the real, effective
# gate already; `error: 40` only changes the printed severity label, not whether it blocks.
closure_body_length:
  warning: 25
  error: 40

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 40
  error: 80

cyclomatic_complexity:
  warning: 16
  error: 25

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - i
    - j
    - di
    - dj
    - dx
    - dy

attributes:
  always_on_same_line:
    - "@IBAction"
    - "@NSManaged"
  always_on_line_above:
    - "@available"

modifier_order:
  preferred_modifier_order:
    - override
    - acl
    - setterACL
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

trailing_whitespace:
  ignores_empty_lines: true

vertical_whitespace:
  max_empty_lines: 1

nesting:
  type_level:
    warning: 3
    error: 3
  function_level:
    warning: 3
    error: 3

custom_rules:
  one_type_per_file:
    name: "One Type Per File"
    # Must only fire when a SECOND top-level type declaration exists in the same file — a plain
    # "match every type declaration" regex (the previous version of this rule) flagged every file
    # that has even one type, since regex custom_rules report every match with no built-in
    # per-file counting. This pattern instead requires two type declarations to both be present,
    # anchored at column 0 (no leading whitespace) so nested/private helper types declared inside
    # another type never trigger it — only two genuinely top-level types in the same file do.
    regex: '(^|\n)((?:public |internal |private |fileprivate |open )?(?:final |indirect )?(?:class|struct|enum|protocol|actor) \w+)[\s\S]*?\n((?:public |internal |private |fileprivate |open )?(?:final |indirect )?(?:class|struct|enum|protocol|actor) \w+)'
    message: "Only one top-level type is allowed per file — this file declares more than one."
    severity: error