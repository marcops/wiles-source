excluded:
  - .build
  - .swiftpm
  - dist
  - releases
  - Wiles.app
  - .claude

disabled_rules:
  - superfluous_disable_command

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - closure_spacing
  - empty_count
  - fatal_error_message
  - first_where
  - overridden_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - weak_delegate
  - prefer_self_in_static_references
  - yoda_condition
  - modifier_order
  - attributes
  - explicit_init
  - array_init
  - last_where
  - contains_over_first_not_nil
  - redundant_type_annotation
  - closure_body_length

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 180
  error: 180

type_body_length:
  warning: 400
  error: 500

closure_body_length:
  warning: 25
  error: 25

file_length:
  warning: 500
  error: 500

function_body_length:
  warning: 40
  error: 40

cyclomatic_complexity:
  warning: 14
  error: 14

identifier_name:
  min_length:
    warning: 2
    error: 2
  excluded:
    - id
    - x
    - y
    - i
    - j
    - di
    - dj
    - dx
    - dy

attributes:
  always_on_same_line:
    - "@IBAction"
    - "@NSManaged"
  always_on_line_above:
    - "@available"

modifier_order:
  preferred_modifier_order:
    - override
    - acl
    - setterACL
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

trailing_whitespace:
  ignores_empty_lines: true

vertical_whitespace:
  max_empty_lines: 1

nesting:
  type_level:
    warning: 3
    error: 3
  function_level:
    warning: 3
    error: 3

custom_rules:
  one_type_per_file:
    name: "One Type Per File"
    # Must only fire when a SECOND top-level type declaration exists in the same file — a plain
    # "match every type declaration" regex (the previous version of this rule) flagged every file
    # that has even one type, since regex custom_rules report every match with no built-in
    # per-file counting. This pattern instead requires two type declarations to both be present,
    # anchored at column 0 (no leading whitespace) so nested/private helper types declared inside
    # another type never trigger it — only two genuinely top-level types in the same file do.
    # Only counts non-private/fileprivate types: a `private`/`fileprivate` type is a file-scoped
    # implementation detail invisible outside the file (e.g. a FocusedValueKey marker paired with
    # its FocusedValues extension), not a second unit of public API sharing the file.
    regex: '(^|\n)((?:public |internal |open )?(?:final |indirect )?(?:class|struct|enum|protocol|actor) \w+)[\s\S]*?\n((?:public |internal |open )?(?:final |indirect )?(?:class|struct|enum|protocol|actor) \w+)'
    message: "Only one top-level type is allowed per file — this file declares more than one."
    severity: error
  no_print_in_production:
    name: "No print() in Production Code"
    included: ".*/Sources/.*\\.swift"
    regex: '\bprint\('
    message: "Use ErrorReporter.report(...) (GitBeacon) instead of print() for logging in production code."
    severity: error
  no_any_view:
    name: "No AnyView"
    regex: '\bAnyView\('
    message: "AnyView erases SwiftUI's structural identity and forces aggressive re-rendering. Use @ViewBuilder with if/else or switch instead."
    severity: error