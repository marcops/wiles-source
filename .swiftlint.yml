excluded:
  - .build
  - .swiftpm
  - dist
  - releases
  - Wiles.app
  - .claude
  # Out-of-process AX UI-test runner: a CLI tool, not shipped app code. The app-specific
  # custom rules (no_print_in_production on its stdout reporter, one_type_per_file on tiny
  # AX helper structs, …) don't apply to it.
  - UITestRunner

disabled_rules:
  - superfluous_disable_command

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - closure_spacing
  - empty_count
  - fatal_error_message
  - first_where
  - overridden_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - weak_delegate
  - prefer_self_in_static_references
  - yoda_condition
  - modifier_order
  - attributes
  - explicit_init
  - array_init
  - last_where
  - contains_over_first_not_nil
  - redundant_type_annotation
  - closure_body_length

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 180
  error: 180

type_body_length:
  warning: 400
  error: 500

closure_body_length:
  warning: 25
  error: 25

file_length:
  warning: 500
  error: 500

function_body_length:
  warning: 40
  error: 40

cyclomatic_complexity:
  warning: 14
  error: 14

identifier_name:
  min_length:
    warning: 2
    error: 2
  excluded:
    - id
    - x
    - y
    - i
    - j
    - di
    - dj
    - dx
    - dy

attributes:
  always_on_same_line:
    - "@IBAction"
    - "@NSManaged"
  always_on_line_above:
    - "@available"

modifier_order:
  preferred_modifier_order:
    - override
    - acl
    - setterACL
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

trailing_whitespace:
  ignores_empty_lines: true

vertical_whitespace:
  max_empty_lines: 1

nesting:
  type_level:
    warning: 3
    error: 3
  function_level:
    warning: 3
    error: 3

custom_rules:
  one_type_per_file:
    name: "One Type Per File"
    # Must only fire when a SECOND top-level type declaration exists in the same file — a plain
    # "match every type declaration" regex (the previous version of this rule) flagged every file
    # that has even one type, since regex custom_rules report every match with no built-in
    # per-file counting. This pattern instead requires two type declarations to both be present,
    # anchored at column 0 (no leading whitespace) so nested/private helper types declared inside
    # another type never trigger it — only two genuinely top-level types in the same file do.
    # Only counts non-private/fileprivate types: a `private`/`fileprivate` type is a file-scoped
    # implementation detail invisible outside the file (e.g. a FocusedValueKey marker paired with
    # its FocusedValues extension), not a second unit of public API sharing the file.
    # `typealias` is included in the alternation alongside class/struct/enum/protocol/actor: a
    # public typealias renaming a type declared earlier in the same file (e.g. `class ArchiveService
    # { ... }` + `public typealias ZipArchiveService = ArchiveService`) is the same file/type-identity
    # confusion this rule exists to catch, even though a typealias isn't a new type declaration.
    regex: '(^|\n)((?:public |internal |open )?(?:final |indirect )?(?:class|struct|enum|protocol|actor|typealias) \w+)[\s\S]*?\n((?:public |internal |open )?(?:final |indirect )?(?:class|struct|enum|protocol|actor|typealias) \w+)'
    message: "Only one top-level type is allowed per file — this file declares more than one (or renames one via typealias)."
    severity: error
  private_helper_type_needs_own_file:
    name: "Private Helper Type Needs Its Own File"
    # Separate, narrower companion to `one_type_per_file` above — that rule deliberately skips
    # private/fileprivate types entirely (see its comment), to allow a legitimate pattern: a
    # private marker type paired with its own extension, named so it's obviously a single-purpose
    # implementation detail (e.g. `private struct SomeFocusedValueKey: FocusedValueKey` living next
    # to `extension FocusedValues { ... }` in the same file — see WindowUIStateKey.swift).
    # This rule catches the OTHER private-type case that slips through that exemption: a
    # private/fileprivate helper type (not the Key-marker pattern) bundled into a file alongside
    # ANY other top-level type — its own unrelated public/internal type (e.g. ColumnAutoFitService's
    # private ColumnTextSpec helper) or another unrelated private type (e.g. three unrelated
    # private ViewModifier structs in SharedViewHelpers.swift). Each still needs its own file per
    # SWIFT_LANG_RULES.md's "No Inline Helper Types" rule, private or not. Matches on the SECOND of
    # two type declarations being the private-non-Key one, regardless of what the first is (public,
    # internal, or private) — covers both "public type + private helper" and "private + private".
    # The `(?!\w*Key\b)` lookahead excludes any type whose name ends in "Key", so the intentionally
    # exempted FocusedValueKey-marker pattern is never flagged by this rule either.
    regex: '(^|\n)((?:public |internal |open |private |fileprivate )?(?:final |indirect )?(?:class|struct|enum|actor) \w+)[\s\S]*?\n(private |fileprivate )(?:final |indirect )?(?:class|struct|enum|actor) (?!\w*Key\b)\w+'
    message: "A private/fileprivate helper type is bundled into a file alongside another unrelated top-level type — it belongs in its own file, unless it's a Key-marker type paired with its own extension (the one exempted pattern, see WindowUIStateKey.swift)."
    severity: error
  no_print_in_production:
    name: "No print() in Production Code"
    included: ".*/Sources/.*\\.swift"
    regex: '\bprint\('
    message: "Use ErrorReporter.report(...) (GitBeacon) instead of print() for logging in production code."
    severity: error
  no_any_view:
    name: "No AnyView"
    regex: '\bAnyView\('
    message: "AnyView erases SwiftUI's structural identity and forces aggressive re-rendering. Use @ViewBuilder with if/else or switch instead."
    severity: error
  no_inline_compound_condition:
    name: "No Inline Compound Condition (3+ Terms)"
    # DEV_RULES.md's "No Inline Compound Conditions": an if/guard/else-if combining 3+ terms via
    # ||/&& must be extracted into a named comparison function instead of left as an inline boolean
    # chain (see ArchiveService.swift's isTarArchive/SearchFilterService.swift's isFilterToken for
    # the intended shape). 3 terms means at least 2 operators, so this fires on the SECOND `||`/`&&`
    # found between the `if`/`guard`/`else if` keyword and that line's `{`/end-of-line — deliberately
    # single-line only (`[^\n{]*`), since a condition already broken across multiple lines to stay
    # under line_length is usually one already given a moment's thought, and scanning across
    # newlines here would risk matching unrelated code that follows. Mixed `||`/`&&` chains still
    # count (both alternate in the same character class), matching the rule's own "&&/||" wording.
    regex: '\b(if|guard|else if)\b[^\n{]*(\|\||&&)[^\n{]*(\|\||&&)'
    message: "An if/guard/else-if combining 3+ terms with ||/&& must be extracted into a named comparison function instead of left as an inline boolean chain (DEV_RULES.md 'No Inline Compound Conditions')."
    severity: warning
  no_hardcoded_swiftui_text:
    included: ".*/Sources/.*\\.swift"
    name: "No Hardcoded SwiftUI Text"
    # SWIFT_LANG_RULES.md's "Zero Hardcoded User-Facing Text": Text(...)/Button(...)/Label(...)'s
    # first positional argument must go through tr(...)/L10n, not a raw string literal (the
    # MainContentView.swift "OK"/"An error occurred." bug this rule exists to catch). Requires the
    # literal to directly follow the opening paren and contain at least two letters (so `Text("%")`/
    # `Button("")` icon-only calls aren't flagged) and excludes any backslash in the literal
    # (`[^"\\]*`), which rules out string interpolation (`\(...)`) — an interpolated call almost
    # always wraps its dynamic piece in `tr(...)` already (e.g. `Text("\(count) \(appState.tr(...))")`
    # ) and isn't the plain-hardcoded-prose case this targets. Doesn't catch `Text(verbatim:)`,
    # a trailing-labeled second argument, or a literal built from concatenation — narrow on purpose
    # to keep false positives at zero; a broader net would need semantic parsing, not regex.
    regex: '\b(Text|Button|Label)\("[^"\\]*[A-Za-z]{2}[^"\\]*"'
    message: "Hardcoded user-facing text passed directly to Text()/Button()/Label() — route it through tr()/L10n instead (SWIFT_LANG_RULES.md 'Zero Hardcoded User-Facing Text')."
    severity: warning
  no_hardcoded_help_accessibility_text:
    included: ".*/Sources/.*\\.swift"
    name: "No Hardcoded .help()/Accessibility Text"
    # Same "Zero Hardcoded User-Facing Text" rule as no_hardcoded_swiftui_text above, but for the
    # three modifiers that rule doesn't cover: `.help(...)` (tooltip), `.accessibilityLabel(...)`,
    # and `.accessibilityHint(...)`. Added after this review found HeaderBarView.swift's
    # searchButton `.help("\(appState.tr(.searchPlaceholder)) (Cmd+F)")` — the interpolated part
    # was already localized, but the trailing "(Cmd+F)" literal segment was hardcoded English
    # smuggled in alongside a properly-localized call, which the plain "starts with a literal"
    # check below still catches since the string literal argument itself starts with `"\(`, not a
    # bare letter — wait: this specific case starts with an interpolation, not a leading literal,
    # so it is NOT caught by this narrow regex (documented limitation, same class of gap as
    # no_hardcoded_swiftui_text's own interpolation exclusion) — this rule instead catches the
    # more common case of a `.help(...)`/accessibility call whose argument is a PURE hardcoded
    # string with no localization at all, e.g. `.help("Delete this file")`. Same shape as
    # no_hardcoded_swiftui_text: literal must directly follow the opening paren, contain 2+ letters
    # (so icon-only "%"/empty strings aren't flagged), and contain no backslash (so interpolated
    # calls that already route part of the string through tr() aren't flagged).
    regex: '\.(help|accessibilityLabel|accessibilityHint)\("[^"\\]*[A-Za-z]{2}[^"\\]*"'
    message: "Hardcoded user-facing text passed directly to .help()/.accessibilityLabel()/.accessibilityHint() — route it through tr()/L10n instead (SWIFT_LANG_RULES.md 'Zero Hardcoded User-Facing Text')."
    severity: warning
  no_hardcoded_secrets:
    name: "No Hardcoded Credentials/API Tokens"
    # Added after this review found a live-looking GitHub Personal Access Token hardcoded in
    # Constants/CrashReportingConstants.swift and committed to source. Matches known secret-token
    # prefixes (GitHub PAT/app tokens, OpenAI-style keys, AWS access keys, Slack tokens) followed by
    # enough token-body characters to rule out matching just the prefix word in a comment/doc. Not
    # scoped to Sources/ only (unlike the other rules here) — a leaked credential in Tests/ or
    # anywhere else in the repo is just as real a leak once committed to git history.
    regex: '(github_pat_[A-Za-z0-9_]{20,}|gh[oprsu]_[A-Za-z0-9]{30,}|sk-(proj-)?[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})'
    message: "This matches a known hardcoded-credential pattern (GitHub PAT/token, OpenAI-style key, AWS access key, or Slack token) committed directly to source. Move it to Keychain, an environment variable, or a git-ignored local config loaded at runtime — and rotate/revoke it immediately if it has already been committed."
    severity: error
  no_redundant_bool_comparison:
    name: "No Redundant Boolean Comparison"
    # There's no built-in SwiftLint rule for this in the installed version (0.65.1) — checked via
    # `swiftlint rules`, no `redundant_bool_comparison` identifier exists — so this is a custom_rule
    # instead. Added after this review found NewFileTemplateService.swift:13's
    # `if !targetURL.pathExtension.isEmpty == false` — a confusing double negative that simply
    # reduces to `if targetURL.pathExtension.isEmpty`. Matches any expression compared with
    # `== true`/`== false`/`!= true`/`!= false`, which is always redundant (the comparison itself
    # is either a no-op or a needless negation of whatever's on the left).
    regex: '(==|!=)\s*(true|false)\b'
    message: "Redundant comparison against true/false — simplify to the boolean expression itself (negate it with `!` instead of `== false`/`!= true` if needed)."
    severity: warning
  no_naive_path_prefix_check:
    name: "No Naive .path.hasPrefix() for Path Containment"
    # Added after this review found FolderNode.swift:42's `homeURL.path.hasPrefix(stdURL.path)` —
    # a raw string-prefix check with no trailing separator, which misclassifies a sibling directory
    # whose name is a string-prefix of another (e.g. "/Users/marco" vs "/Users/marco2") as an
    # ancestor/descendant. The same family of mistake is the root cause class behind a real
    # path-traversal-adjacent bug found in LocalHttpServerService.swift (a boundary check that
    # doesn't account for symlinks). Not every hit here is necessarily buggy — e.g.
    # AppState+Favorites.swift:51 already appends "/" before comparing, which is the correct
    # pattern — but every occurrence is worth a manual glance to confirm the separator/symlink
    # edge case was actually considered, hence `warning` not `error`.
    regex: '\.path\.hasPrefix\('
    message: "Raw .path.hasPrefix() for path containment/ancestor checks can misclassify sibling paths that share a string prefix (e.g. \"/Users/marco\" vs \"/Users/marco2\"), and doesn't account for symlinks resolving outside the expected boundary. Verify a trailing path separator is appended before comparing (see AppState+Favorites.swift's \"+ \\\"/\\\"\" pattern), or compare .pathComponents / resolvingSymlinksInPath() instead."
    severity: warning
  no_bare_with_animation:
    name: "No Bare withAnimation (Use a Named MotionTokens Curve)"
    # Added after this review found HeaderBarView.swift:234's bare `withAnimation { ... }` — the
    # one animated interaction in that file (and its siblings) not routed through a named
    # MotionTokens curve (`.quickEase`, `.smoothEase`, `.snappySpring`, `.expandSpring`, etc.),
    # which reads as an oversight rather than an intentional choice given how consistently the rest
    # of the codebase names its animation curves.
    regex: '\bwithAnimation\s*\{'
    message: "Bare withAnimation { ... } with no explicit curve — use a named MotionTokens case (e.g. withAnimation(MotionTokens.quickEase) { ... }) for consistency with the rest of the app's animation system."
    severity: warning
  event_monitor_should_have_deinit_backstop:
    name: "NSEvent Monitor Should Have a deinit Backstop"
    # Added after this review found ClickOutsideDetector.swift's local event monitor token is only
    # released in viewWillMove(toWindow: nil) and removeFromSuperview() — never in deinit — so a
    # view instance deallocated without going through either AppKit lifecycle override (a path that
    # can't be ruled out for every future caller) leaks a permanent, unremovable monitor
    # registration. This fires whenever a file registers an NSEvent local/global monitor but the
    # word "deinit" never appears anywhere in that same file, regardless of what other cleanup
    # exists (viewWillMove/removeFromSuperview/etc.) — deinit is the one backstop that always runs,
    # so it's worth having in addition to those, not instead of them. `warning`, not `error`: this
    # is a defense-in-depth recommendation, not a proven leak in every file it flags (e.g.
    # GlobalKeyMonitor.swift's existing viewWillMove/removeFromSuperview cleanup was independently
    # reviewed and found correct — adding a deinit backstop there is extra safety, not a fix to a
    # confirmed bug).
    regex: '\A(?:(?!\bdeinit\b)[\s\S])*\bNSEvent\.add(Local|Global)MonitorForEvents\b(?:(?!\bdeinit\b)[\s\S])*\z'
    message: "This file registers an NSEvent local/global monitor but has no deinit anywhere as a backstop cleanup path. Add `deinit { /* remove the monitor token here */ }` in addition to whatever other lifecycle cleanup already exists, so the monitor can't outlive the object under an unanticipated teardown path."
    severity: warning
  notification_observer_needs_removal:
    name: "Closure-Based NotificationCenter Observer Needs removeObserver"
    # Added proactively per this review's own instructions to scrutinize closure-based
    # `addObserver(forName:object:queue:using:)` registrations for a missing corresponding
    # `removeObserver` call (the returned token must be stored and explicitly removed, or the
    # observer becomes a permanent, unremovable registration that stacks further on every
    # re-instantiation). No current violation was found (SmartFolderService.swift correctly calls
    # removeObserver), but this guards against a future regression rather than re-deriving the
    # check by hand each time new code is added.
    regex: '\A(?:(?!removeObserver)[\s\S])*\baddObserver\(forName:(?:(?!removeObserver)[\s\S])*\z'
    message: "This file registers a closure-based NotificationCenter observer via addObserver(forName:...) but never calls removeObserver anywhere in the file. Store the returned token and remove it in deinit/onDisappear, or the observer registration leaks permanently."
    severity: warning
  no_service_baked_in_language:
    name: "Stateless Service Must Not Bake In a Display Language"
    # Added by this review's fix pass (finding M5 / rule R2). A stateless service (enum/struct of
    # static funcs, no PreferencesStore access) that renders a user-facing string via
    # `L10n.string(.someLiteralKey, lang: .system)` locks that string to the *system* language,
    # ignoring the in-app language setting — AppState.showError only re-localizes WilesError.
    # Throw `WilesError.localized(key:arguments:)` instead (localized at display time), or take a
    # `lang:` parameter from a @MainActor caller. Matches only a literal `.caseName` first argument,
    # so WilesError.swift's own `L10n.string(key, lang: .system)` fallback (a variable key) is not
    # flagged. `excluded`: OpenWithService (NSOpenPanel title) and DiskSpaceVisualizerService
    # (chart label) are the two non-throwing call sites left for a follow-up pass.
    included: ".*/Sources/.*\\.swift"
    excluded: ".*/(OpenWithService|DiskSpaceVisualizerService)\\.swift"
    regex: 'L10n\.string\(\s*\.[A-Za-z]\w*\s*,\s*lang:\s*\.system'
    message: "Stateless service renders a user-facing string in the system language, ignoring the in-app language. Throw WilesError.localized(key:arguments:) (localized at display time) or take a lang: parameter from a @MainActor caller (SWIFT_LANG_RULES.md / M5)."
    severity: warning
  no_wholesale_didset_revert:
    name: "No Wholesale didSet Revert (Assigning oldValue Back)"
    # The H1 bug class (finding LR1). A `didSet` that reassigns `oldValue` back to the property on a
    # cap/validation failure silently discards the whole user action — the fix H1 needed was to
    # trim/evict down to the cap instead (see PreferencesStore's `expandedTreePaths` /
    # `perFolderViewModes` didSets, which now evict rather than revert). Flags a single-line-body
    # `= oldValue` assignment inside a `didSet` (`didSet { ... = oldValue ... }`), scoped to
    # `.../Stores/` where the persisted-preference pattern lives. `warning`, not `error`: a
    # deliberate "reject invalid input, keep previous value" is occasionally correct, but it must be
    # a conscious revert-vs-clamp-vs-evict decision, not a copy-paste default. Currently flags
    # nothing (H1 is already fixed) — purely preventive.
    included: ".*/Stores/.*\\.swift"
    regex: 'didSet\s*\{[^}]*=\s*oldValue'
    message: "A didSet that assigns oldValue back to its property wholesale silently discards the user's action when a cap/validation fails (finding H1). Evict/clamp down to the limit instead, or make the revert a conscious, commented choice."
    severity: warning
  no_localized_description_in_show_error:
    name: "No .localizedDescription Passed to showError()"
    # A `WilesError` conforms to `LocalizedError`, so `error.localizedDescription` returns the
    # hardcoded English `errorDescription` — bypassing `AppState.errorText(for:)` /
    # `WilesError.localizedMessage(lang:)`, which re-localize in the in-app language. Pass the
    # error itself: `appState.showError(error)`.
    included: ".*/Sources/.*\\.swift"
    regex: 'showError\([^)]*\.localizedDescription'
    message: "Pass the error itself to showError(...), not error.localizedDescription — the latter leaks the English errorDescription for a WilesError instead of routing through errorText(for:)/localizedMessage(lang:)."
    severity: warning
  no_adhoc_byte_count_formatter:
    name: "No Ad-Hoc ByteCountFormatter"
    # ByteCountFormatter.string(fromByteCount:countStyle:) builds a throwaway formatter every call —
    # it's read per row per render in the file list / disk-usage sidebar / footer. Route through the
    # one shared `ByteFormat.fileSize(_:)`.
    included: ".*/Sources/.*\\.swift"
    excluded: ".*/ByteFormat\\.swift"
    regex: 'ByteCountFormatter'
    message: "Use ByteFormat.fileSize(_:) — the shared formatter — instead of ByteCountFormatter directly (it allocates a new formatter per call in the render path)."
    severity: warning
  no_userdefaults_in_state_default:
    name: "No UserDefaults Read in a @State Default"
    # ARCHITECTURE_CODE_REVIEW.md finding B18-4 (and the [[feedback_swiftui_init_side_effects]]
    # memory class): a `@State` stored-property default expression is re-evaluated on every
    # reconstruction of the View struct (i.e. every parent re-render), even though `@State` keeps
    # only the first value per view identity — so `@State private var x = UserDefaults.standard...`
    # does a wasted synchronous UserDefaults read on every re-render, and more generally reads
    # persisted state before the view's own lifecycle has started. Load it in `.task`/`.onAppear`
    # into a `@State` that starts empty instead. Single-line match only (`[^\n]*`); `@State\b`
    # doesn't match `@StateObject` (no word boundary between `e` and `O`).
    included: ".*/Sources/.*\\.swift"
    regex: '@State\b[^\n=]*=[^\n]*\bUserDefaults\b'
    message: "A @State default that reads UserDefaults runs on every reconstruction of the View struct (parent re-render), not once. Start the @State empty and load in .task/.onAppear (ARCHITECTURE_CODE_REVIEW.md B18-4)."
    severity: warning
  no_finding_id_in_comment:
    name: "No Review Finding ID in Production Comments"
    # Added after the 2026-09-04 architecture & code review found 128 production comments
    # referencing an opaque internal review-finding ID (the project's own standing rule — keep
    # finding IDs in the review doc/tests only, not shipped source). Covers every ID shape found
    # across past review passes: the current `[Severity][Impact]-[ROI]` scheme (`MM-078`,
    # `LL-020`, `HH-234`), the legacy bracketed shorthand (`[A3]`, `[M77]`, `[L34]`), and the
    # legacy single-letter/single-digit hyphenated shorthand (`B1-1`). Deliberately does NOT match
    # a bare "R1"-"R5" (Engineering Rule references in DEV_RULES.md/SWIFT_LANG_RULES.md/
    # WILES_RULES.md are permanent, named, cross-referenced rules — not opaque per-review IDs) or
    # `SE-0338` (a Swift Evolution proposal number, always 4 digits — the `\b` after `[0-9]{3}`
    # fails when a 4th digit follows, so it can never match a 4-digit suffix). Verified against
    # the entire `Sources/Wiles` tree with zero false positives on both counts.
    included: ".*/Sources/.*\\.swift"
    regex: '//.*(\[[A-Z][0-9]{1,3}\]|\b[A-Z]{2}-[0-9]{3}\b|\b[A-Z][0-9]-[0-9]{1,3}\b)'
    message: "Comment references an opaque internal review-finding ID — keep the engineering reasoning in prose, but drop the ID reference itself (it means nothing to a reader without the originating review document). Finding IDs belong in the review doc/tests only."
    severity: warning
  no_contentshape_inside_button_label:
    name: "No .contentShape Inside a Button's Composite Label"
    # ARCHITECTURE_CODE_REVIEW.md findings B16-3 / B18-3, enforcing SWIFT_LANG_RULES.md's "Custom
    # Tappable Content MUST Have an Explicit `.contentShape`": a real `Button { ... } label: { ... }`
    # on macOS keeps routing clicks only through the label's rendered non-transparent pixels even
    # with `.contentShape(Rectangle())` applied inside the label — the transparent padding around a
    # small icon stays dead. The project already does this correctly with a plain view +
    # `.onTapGesture` + `.accessibilityAddTraits(.isButton)` (see SettingsView.tabButton,
    # DirectoryTreeNodeView.rowContent, PathBarView.breadcrumbPill, TappableRow) but still has real
    # `Button`s with `.contentShape` in their labels in HeaderBarView, FileListHeaderView,
    # AutoOrganizationSheet, SidebarRowView.ejectButton. Matches a `Button { ... } label: { ... }`
    # whose label closure contains `.contentShape(` within ~400 chars. The `Button("title") { }`
    # form has no `label:` and is never matched.
    included: ".*/Sources/.*\\.swift"
    regex: 'Button\s*(\([^)\n]*\))?\s*\{[\s\S]{0,600}?\}\s*label:\s*\{[\s\S]{0,400}?\.contentShape\('
    message: "A real Button with .contentShape inside its label doesn't reliably make the label's transparent padding tappable on macOS. Use a plain view + .contentShape(Rectangle()) + .onTapGesture { } + .accessibilityAddTraits(.isButton) instead (see SettingsView.tabButton / TappableRow; SWIFT_LANG_RULES.md 'Custom Tappable Content')."
    severity: warning
  service_blocking_process_needs_offload:
    name: "Blocking Subprocess I/O in a Service Needs a Structural Offload"
    # ARCHITECTURE_CODE_REVIEW.md AC-2 / B2-2 and SWIFT_LANG_RULES.md pre-commit checklist item 15.
    # A service file that calls `waitUntilExit()` or `readDataToEndOfFile()` (both block) but never
    # mentions `Task.detached` or `nonisolated` anywhere in the file is relying on every caller to
    # remember to detach it — an implicit contract that breaks silently the day a caller runs it on
    # `@MainActor`. Make the offload structural (wrap the blocking call in `Task.detached`, or mark
    # the function `nonisolated` so SE-0338 keeps it off the caller's actor). `warning`, not
    # `error`: a file whose sole entry point is already detached at the one call site can be a
    # deliberate design — but every hit is worth a glance to confirm the offload isn't just implied.
    included: ".*/Sources/.*Service.*\\.swift"
    regex: '\A(?:(?!(?:Task\.detached|nonisolated ))[\s\S])*\b(?:waitUntilExit\(\)|readDataToEndOfFile\(\))'
    message: "This service file makes a blocking subprocess call (waitUntilExit()/readDataToEndOfFile()) but never uses Task.detached or nonisolated — the off-main guarantee is implicit and a future @MainActor caller silently loses it. Wrap it in Task.detached or mark the function nonisolated (SWIFT_LANG_RULES.md checklist item 15; ARCHITECTURE_CODE_REVIEW.md AC-2)."
    severity: warning
  no_adhoc_path_within_check:
    name: "Ad-Hoc pathComponents.prefix() Containment Check"
    # ARCHITECTURE_CODE_REVIEW.md (Consolidação — DRY): the component-wise "is X inside/equal to Y"
    # check (`Array(x.pathComponents.prefix(n)) == y.pathComponents`) is copy-pasted in
    # AppState+Navigation.childToRestore, FolderPickerSheet.isWithinOrEqual, and adjacent spots.
    # It's the *correct* way to do path containment (better than `.path.hasPrefix`, which
    # `no_naive_path_prefix_check` above flags) — but it belongs in one shared `URL` helper, not
    # re-derived per site. Narrow match on the exact `Array( … .pathComponents.prefix(` idiom.
    included: ".*/Sources/.*\\.swift"
    regex: 'Array\(\s*\w*(pathComponents|Components)\.prefix\('
    message: "Component-wise path-containment check copy-pasted here — extract a single shared URL.isWithinOrEqual(_:) / isDescendant(of:) helper and call that (ARCHITECTURE_CODE_REVIEW.md, DRY consolidation)."
    severity: warning
  no_enumerator_without_error_handler:
    name: "FileManager.enumerator Without errorHandler (LR-1)"
    # ARCHITECTURE_CODE_REVIEW.md BA-509 / BB-462 (and Engineering Rule R1). A
    # `FileManager.…enumerator(at:...)` call with no `errorHandler:` argument silently ABORTS THE
    # ENTIRE walk on the first unreadable directory — extremely common under ~/Library without Full
    # Disk Access — and the partial result is then read as complete. This review found 5 real
    # call sites all producing silently-wrong output: DuplicateDetectionService (drops dup groups),
    # DiskSpaceVisualizerService (undercounts folder size, shown as exact), FilePermissionsService
    # .setPermissionsRecursively (applies to half the tree, `applied` looks partial with no error),
    # TrashState.computeTrashSize (undercounts Trash), FolderNode.directoryHasSubfolder (returns
    # false on first error → folder wrongly shown non-expandable). FileSystemService
    # .makeRecursiveSearchEnumerator is the correct model (`errorHandler: { _, _ in true }`).
    # Matches an `.enumerator(` NOT followed within 400 chars by `errorHandler:`. A deliberate
    # abort-on-first-error is rare and must carry a `// swiftlint:disable:next` with a reason.
    included: ".*/Sources/.*\\.swift"
    regex: '\.enumerator\((?![\s\S]{0,400}?errorHandler:)'
    message: "FileManager.enumerator(...) with no `errorHandler:` aborts the whole walk on the first unreadable directory and returns a silent partial result (ARCHITECTURE_CODE_REVIEW.md BA-509). Pass `errorHandler: { _, _ in true }` — see FileSystemService.makeRecursiveSearchEnumerator."
    severity: error
  shared_service_lifecycle_in_view_appear:
    name: "Shared Service start/stop in a Per-Window View's onAppear/onDisappear"
    # A per-window view can't own a .shared service's session lifecycle — a second window's teardown kills it for the first.
    included: ".*/Sources/.*\\.swift"
    regex: '\.on(Appear|Disappear)\s*\{[\s\S]{0,120}?\b\w[\w.]*\.shared\.(start|stop|cancel)\s*\('
    message: "Don't drive a .shared service's start()/stop() from a per-window view's onAppear/onDisappear — own it app-wide, or make the service per-AppState instead of .shared."
    severity: warning
  no_capitalized_on_localized_description:
    name: "No .capitalized on a Localized Description"
    # .capitalized re-cases every word — mangles multi-word system strings in the user's language.
    included: ".*/Sources/.*\\.swift"
    regex: '\.localized(Type)?Description\)?\??\.capitalized\b'
    message: "Drop .capitalized on a localized description (it re-cases every word); upper-case only the first character if needed."
    severity: warning
  no_hidden_files_in_lan_share_listing:
    name: "LAN Share Listing Must Skip Hidden Files"
    # The HTTP share serves this folder to the whole LAN — a listing without .skipsHiddenFiles leaks .git/.env/.ssh.
    included: ".*/Sources/Wiles/Features/HttpSharing/.*\\.swift"
    regex: 'contentsOfDirectory\((?![\s\S]{0,240}?skipsHiddenFiles)'
    message: "Pass .skipsHiddenFiles to the LAN share's directory read (and refuse dotfile requests in serveFile) — it currently exposes .git/.env/.ssh."
    severity: warning
  no_raw_int_pref_restore:
    name: "No Raw defaults.integer(forKey:) in a Preference Store"
    # `UserDefaults.integer(forKey:)` returns 0 for both "never saved" and "explicitly saved 0", so
    # a restore guarded by `if value > 0` silently drops a user's choice of 0 (e.g. a translucency
    # level of 0% reverting to the default on relaunch — DEV_RULES.md "Complete State Persistence").
    # In a preference store you always want the "was it ever written" distinction — that's exactly
    # what PersistablePreferenceStore.loadInt(_:into:from:) does (mirrors loadBool). Route every Int
    # restore through it. The helper file itself is exempt — it's the one place the raw call is
    # correct — same as loadBool.
    included: ".*/Stores/Preferences/.*\\.swift"
    excluded: ".*/PersistablePreferenceStore\\.swift"
    regex: '\.integer\(forKey:'
    message: "Restore an Int preference via PersistablePreferenceStore.loadInt(_:into:from:), not raw defaults.integer(forKey:) — the latter can't tell 'never saved' from 'saved as 0', silently dropping a user's choice of 0."
    severity: error